<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Insurance – Training Calendar</title>
<meta name="description" content="Calendario de capacitaciones de Hero Insurance USA: ACA, Medicare, Supplemental y Life. Hora de Miami (ET).">
<meta name="theme-color" content="#06a3b6">
<link rel="icon" type="image/png" href="hero-logo-transparent.png">
<link rel="apple-touch-icon" href="hero-logo-transparent.png">
<meta property="og:title" content="Hero Insurance – Training Calendar">
<meta property="og:description" content="Calendario de capacitaciones de Hero Insurance USA.">
<meta property="og:image" content="hero-logo-transparent.png">
<meta property="og:type" content="website">
<style>
:root {
  --hero-primary:        #06a3b6;
  --hero-primary-dark:   #048395;
  --hero-primary-light:  #3dbccc;
  --hero-primary-50:     #e8f6f8;
  --hero-bg:             #f0f4f8;
  --hero-card-bg:        #ffffff;
  --hero-text:           #1a2733;
  --hero-text-muted:     #5a6b7a;
  --hero-text-subtle:    #8a9aa8;
  --hero-border:         #d8e1ea;
  --hero-border-soft:    #e8edf3;
  --hero-success:        #22a06b;
  --hero-warning:        #e8a317;
  --hero-danger:         #d64545;
  --hero-font:           system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --hero-radius-sm:      6px;
  --hero-radius:         10px;
  --hero-radius-lg:      16px;
  --hero-shadow-sm:      0 1px 2px rgba(26,39,51,0.04);
  --hero-shadow:         0 2px 8px rgba(6,163,182,0.06);
  --hero-shadow-lg:      0 12px 32px rgba(6,163,182,0.12);

  /* Category colors */
  --cat-aca:      #06a3b6;
  --cat-medicare: #0065F3;
  --cat-supp:     #22a06b;
  --cat-life:     #e8a317;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--hero-font);
  background: var(--hero-bg);
  color: var(--hero-text);
  min-height: 100vh;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* ════════════════════════════════════════════════════
   TOPBAR
   ════════════════════════════════════════════════════ */
.topbar {
  background: var(--hero-card-bg);
  border-bottom: 1px solid var(--hero-border);
  height: 64px;
  display: flex; align-items: center;
  padding: 0 32px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: var(--hero-shadow-sm);
}

.topbar-logo img { height: 40px; width: auto; display: block; }

.topbar-divider { width: 1px; height: 28px; background: var(--hero-border); margin: 0 20px; }

.topbar-breadcrumb {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--hero-text-muted);
}
.topbar-breadcrumb b { color: var(--hero-text); font-weight: 700; }

.topbar-right {
  margin-left: auto;
  display: flex; align-items: center; gap: 12px;
}

.view-toggle {
  display: flex;
  background: var(--hero-bg);
  border: 1px solid var(--hero-border);
  border-radius: var(--hero-radius-sm);
  padding: 3px;
}
.view-toggle button {
  padding: 6px 12px;
  font-family: var(--hero-font);
  font-size: 12px; font-weight: 600;
  border: none; background: transparent;
  color: var(--hero-text-muted);
  cursor: pointer; transition: all 0.15s;
  border-radius: 4px;
  display: flex; align-items: center; gap: 6px;
}
.view-toggle button:hover { color: var(--hero-primary); }
.view-toggle button.active {
  background: var(--hero-card-bg);
  color: var(--hero-primary);
  box-shadow: var(--hero-shadow-sm);
}

.lang-switcher {
  display: flex;
  border: 1px solid var(--hero-border);
  border-radius: var(--hero-radius-sm);
  overflow: hidden;
}
.lang-btn {
  padding: 7px 12px;
  font-family: var(--hero-font);
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.5px;
  border: none; background: var(--hero-card-bg);
  color: var(--hero-text-muted);
  cursor: pointer; transition: all 0.15s;
  min-width: 38px;
}
.lang-btn:not(:last-child) { border-right: 1px solid var(--hero-border); }
.lang-btn.active { background: var(--hero-primary); color: #fff; }
.lang-btn:not(.active):hover { background: var(--hero-primary-50); color: var(--hero-primary); }

/* ════════════════════════════════════════════════════
   HERO BANNER (Featured next event)
   ════════════════════════════════════════════════════ */
.hero-banner {
  background:
    linear-gradient(135deg, rgba(6,163,182,0.04) 0%, rgba(6,163,182,0.0) 60%),
    var(--hero-card-bg);
  border-bottom: 1px solid var(--hero-border);
  padding: 32px;
  position: relative;
  overflow: hidden;
}

.hero-banner::before {
  content: '';
  position: absolute;
  top: -100px; right: -100px;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(6,163,182,0.06) 0%, transparent 70%);
  pointer-events: none;
}

.banner-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 40px;
  align-items: center;
  position: relative;
  z-index: 1;
}

.banner-left .label-tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--hero-primary-50);
  color: var(--hero-primary);
  font-size: 11px; font-weight: 700;
  letter-spacing: 1.2px; text-transform: uppercase;
  padding: 5px 12px;
  border-radius: 100px;
  margin-bottom: 14px;
}
.banner-left .label-tag .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--hero-primary);
  animation: pulse 1.6s infinite;
}

.banner-left h1 {
  font-family: var(--hero-font);
  font-size: clamp(22px, 3vw, 32px);
  font-weight: 900;
  color: var(--hero-text);
  line-height: 1.15;
  margin-bottom: 6px;
  letter-spacing: -0.5px;
}

.banner-left .next-meta {
  display: flex; flex-wrap: wrap; gap: 16px;
  margin-top: 14px;
  font-size: 14px;
  color: var(--hero-text-muted);
}
.banner-left .next-meta span { display: inline-flex; align-items: center; gap: 6px; }
.banner-left .next-meta b { color: var(--hero-text); font-weight: 700; }

.banner-right {
  display: flex; flex-direction: column; gap: 10px;
  align-items: flex-end;
}

.countdown-card {
  background: linear-gradient(135deg, var(--hero-primary) 0%, var(--hero-primary-dark) 100%);
  color: #fff;
  padding: 14px 22px;
  border-radius: var(--hero-radius);
  text-align: center;
  box-shadow: var(--hero-shadow-lg);
  min-width: 160px;
}
.countdown-card .count-num {
  font-size: 36px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -1px;
}
.countdown-card .count-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-top: 4px;
  opacity: 0.9;
}

.banner-actions { display: flex; gap: 8px; }

.btn-primary {
  background: var(--hero-primary);
  color: #fff;
  font-family: var(--hero-font);
  font-size: 13px; font-weight: 700;
  padding: 10px 18px;
  border-radius: var(--hero-radius-sm);
  border: none;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 6px;
  text-decoration: none;
}
.btn-primary:hover { background: var(--hero-primary-dark); transform: translateY(-1px); box-shadow: var(--hero-shadow); }

.btn-secondary {
  background: var(--hero-card-bg);
  color: var(--hero-text);
  font-family: var(--hero-font);
  font-size: 13px; font-weight: 600;
  padding: 10px 18px;
  border-radius: var(--hero-radius-sm);
  border: 1px solid var(--hero-border);
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 6px;
  text-decoration: none;
}
.btn-secondary:hover { border-color: var(--hero-primary); color: var(--hero-primary); }

/* No upcoming state in banner */
.banner-empty {
  text-align: center;
  padding: 20px;
  color: var(--hero-text-muted);
  grid-column: 1 / -1;
}
.banner-empty h2 { font-size: 18px; color: var(--hero-text); margin-bottom: 6px; }

/* ════════════════════════════════════════════════════
   MAIN LAYOUT
   ════════════════════════════════════════════════════ */
.main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 28px 32px 60px;
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 28px;
  align-items: start;
}

/* SECTION HEADER */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
  flex-wrap: wrap; gap: 12px;
}
.section-head h2 {
  font-family: var(--hero-font);
  font-size: 18px; font-weight: 700;
  color: var(--hero-text);
  display: flex; align-items: center; gap: 10px;
}
.section-head h2 .count {
  background: var(--hero-primary-50);
  color: var(--hero-primary);
  font-size: 12px; font-weight: 700;
  padding: 2px 10px;
  border-radius: 100px;
}

.sync-bar {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px;
  color: var(--hero-text-muted);
}
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hero-text-subtle); }
.sync-dot.loading { background: var(--hero-warning); animation: pulse 1s infinite; }
.sync-dot.ok { background: var(--hero-success); }
.sync-dot.error { background: var(--hero-danger); }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ════════════════════════════════════════════════════
   FILTERS BAR
   ════════════════════════════════════════════════════ */
.filters-row {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-bottom: 18px;
}

.filter-chip {
  padding: 6px 14px;
  font-family: var(--hero-font);
  font-size: 12px; font-weight: 700;
  border-radius: 100px;
  border: 1px solid var(--hero-border);
  background: var(--hero-card-bg);
  color: var(--hero-text-muted);
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 6px;
}
.filter-chip:hover { border-color: var(--hero-primary); color: var(--hero-primary); }
.filter-chip .dot { width: 6px; height: 6px; border-radius: 50%; }
.filter-chip[data-filter="aca"] .dot      { background: var(--cat-aca); }
.filter-chip[data-filter="medicare"] .dot { background: var(--cat-medicare); }
.filter-chip[data-filter="supp"] .dot     { background: var(--cat-supp); }
.filter-chip[data-filter="life"] .dot     { background: var(--cat-life); }

.filter-chip.active {
  background: var(--hero-text);
  border-color: var(--hero-text);
  color: #fff;
}
.filter-chip.active[data-filter="aca"]      { background: var(--cat-aca);      border-color: var(--cat-aca); }
.filter-chip.active[data-filter="medicare"] { background: var(--cat-medicare); border-color: var(--cat-medicare); }
.filter-chip.active[data-filter="supp"]     { background: var(--cat-supp);     border-color: var(--cat-supp); }
.filter-chip.active[data-filter="life"]     { background: var(--cat-life);     border-color: var(--cat-life); }
.filter-chip.active .dot { background: #fff; }

/* ════════════════════════════════════════════════════
   TRAINING LIST CARDS
   ════════════════════════════════════════════════════ */
.training-list { display: flex; flex-direction: column; gap: 10px; }

.training-card {
  background: var(--hero-card-bg);
  border: 1px solid var(--hero-border);
  border-radius: var(--hero-radius);
  padding: 18px 20px;
  transition: all 0.18s;
  cursor: pointer;
  position: relative;
  display: grid;
  grid-template-columns: 72px 1fr auto;
  gap: 18px;
  align-items: center;
}
.training-card:hover {
  border-color: var(--hero-primary);
  box-shadow: var(--hero-shadow);
  transform: translateY(-1px);
}

.training-card .date-block {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: var(--hero-bg);
  border-radius: var(--hero-radius-sm);
  padding: 10px 6px;
  border-left: 3px solid var(--cat-aca);
}
.training-card.medicare .date-block { border-left-color: var(--cat-medicare); }
.training-card.supp     .date-block { border-left-color: var(--cat-supp); }
.training-card.life     .date-block { border-left-color: var(--cat-life); }

.date-block .day {
  font-size: 22px; font-weight: 900;
  color: var(--hero-text);
  line-height: 1;
}
.date-block .month {
  font-size: 10px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--hero-text-muted);
  margin-top: 4px;
}
.date-block .weekday {
  font-size: 10px; font-weight: 600;
  color: var(--hero-text-subtle);
  margin-top: 2px;
}

.training-card .body { min-width: 0; }

.training-card .meta-row {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 6px;
  font-size: 11px;
}

.cat-chip {
  display: inline-flex; align-items: center;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.8px; text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 4px;
}
.cat-chip.aca      { background: rgba(6,163,182,0.12);  color: var(--cat-aca); }
.cat-chip.medicare { background: rgba(0,101,243,0.12);  color: var(--cat-medicare); }
.cat-chip.supp     { background: rgba(34,160,107,0.12); color: var(--cat-supp); }
.cat-chip.life     { background: rgba(232,163,23,0.15); color: #b07a0e; }

.lang-chip {
  display: inline-flex; align-items: center;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.8px;
  padding: 2px 8px;
  border-radius: 4px;
}
.lang-chip.es { background: #fff5d6; color: #856404; }
.lang-chip.en { background: #d6e4ff; color: #084298; }

.now-chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.5px; text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(214,69,69,0.12); color: var(--hero-danger);
}
.now-chip::before { content:''; width:5px; height:5px; border-radius:50%; background:var(--hero-danger); animation:pulse 1.2s infinite; }

.next-chip {
  display: inline-flex; align-items: center;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.5px; text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--hero-primary); color: #fff;
}

.training-card h3 {
  font-family: var(--hero-font);
  font-size: 16px; font-weight: 700;
  color: var(--hero-text);
  margin: 2px 0 6px;
  line-height: 1.3;
}

.training-card .info {
  display: flex; flex-wrap: wrap; gap: 14px;
  font-size: 12.5px;
  color: var(--hero-text-muted);
}
.training-card .info span { display: inline-flex; align-items: center; gap: 5px; }
.training-card .info svg { width: 13px; height: 13px; opacity: 0.7; }

.training-card .actions {
  display: flex; flex-direction: column; gap: 6px;
  align-items: stretch;
}
.training-card .actions .btn-primary,
.training-card .actions .btn-secondary {
  font-size: 12px;
  padding: 8px 14px;
  white-space: nowrap;
}

/* Empty state */
.empty-state {
  background: var(--hero-card-bg);
  border: 1px dashed var(--hero-border);
  border-radius: var(--hero-radius);
  padding: 40px 24px;
  text-align: center;
  color: var(--hero-text-muted);
}
.empty-state .icon {
  width: 48px; height: 48px;
  margin: 0 auto 12px;
  background: var(--hero-bg);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.empty-state h3 { font-size: 15px; color: var(--hero-text); margin-bottom: 4px; }
.empty-state p { font-size: 13px; }

/* Skeleton */
.skeleton-card {
  height: 90px;
  background: linear-gradient(90deg, #f3f6fa 25%, #e8edf3 50%, #f3f6fa 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: var(--hero-radius);
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ════════════════════════════════════════════════════
   SIDEBAR
   ════════════════════════════════════════════════════ */
.sidebar { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 80px; }

.side-card {
  background: var(--hero-card-bg);
  border: 1px solid var(--hero-border);
  border-radius: var(--hero-radius);
  padding: 18px;
}

.side-card h3 {
  font-family: var(--hero-font);
  font-size: 13px; font-weight: 700;
  color: var(--hero-text);
  letter-spacing: 0.3px;
  margin-bottom: 14px;
  display: flex; align-items: center; justify-content: space-between;
}

.side-card h3 .nav-arrows { display: flex; gap: 4px; }
.side-card h3 .nav-arrows button {
  width: 24px; height: 24px;
  border-radius: 5px;
  border: 1px solid var(--hero-border);
  background: var(--hero-card-bg);
  color: var(--hero-text-muted);
  cursor: pointer;
  font-size: 12px;
  transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.side-card h3 .nav-arrows button:hover { border-color: var(--hero-primary); color: var(--hero-primary); }

/* MINI CALENDAR */
.mini-cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  margin-bottom: 4px;
}
.mini-cal-weekdays div {
  text-align: center;
  font-size: 10px; font-weight: 700;
  color: var(--hero-text-subtle);
  letter-spacing: 0.5px;
  padding: 4px 0;
  text-transform: uppercase;
}

.mini-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }

.mini-day {
  aspect-ratio: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
  color: var(--hero-text);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.12s;
  position: relative;
  border: 1px solid transparent;
}
.mini-day:hover { background: var(--hero-bg); }
.mini-day.empty { pointer-events: none; color: transparent; }
.mini-day.has-events { font-weight: 700; }
.mini-day.today {
  background: var(--hero-primary);
  color: #fff;
}
.mini-day.selected {
  border-color: var(--hero-primary);
  background: var(--hero-primary-50);
  color: var(--hero-primary);
}
.mini-day.today.selected { background: var(--hero-primary); color: #fff; }

.mini-day .dots {
  display: flex; gap: 2px;
  margin-top: 2px;
  height: 4px;
}
.mini-day .dots span {
  width: 4px; height: 4px;
  border-radius: 50%;
}
.mini-day.today .dots span { background: #fff !important; }

/* Filters in sidebar */
.filter-list { display: flex; flex-direction: column; gap: 4px; }
.filter-list-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s;
  font-size: 13px;
  color: var(--hero-text);
  border: none;
  background: transparent;
  font-family: var(--hero-font);
  width: 100%;
  text-align: left;
}
.filter-list-item:hover { background: var(--hero-bg); }
.filter-list-item.active { background: var(--hero-primary-50); color: var(--hero-primary); font-weight: 700; }
.filter-list-item .swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.filter-list-item .swatch.all      { background: var(--hero-text); }
.filter-list-item .swatch.aca      { background: var(--cat-aca); }
.filter-list-item .swatch.medicare { background: var(--cat-medicare); }
.filter-list-item .swatch.supp     { background: var(--cat-supp); }
.filter-list-item .swatch.life     { background: var(--cat-life); }
.filter-list-item .num {
  margin-left: auto;
  font-size: 11px;
  font-weight: 600;
  color: var(--hero-text-subtle);
  background: var(--hero-bg);
  padding: 1px 7px;
  border-radius: 100px;
}
.filter-list-item.active .num { background: rgba(6,163,182,0.15); color: var(--hero-primary); }

/* ════════════════════════════════════════════════════
   GRID VIEW (alternative view)
   ════════════════════════════════════════════════════ */
.grid-view { display: none; grid-column: 1 / -1; }
.grid-view.active { display: block; }
.list-view { display: contents; }
.list-view.hidden { display: none; }
.sidebar.hidden { display: none; }

.calendar-grid-wrap {
  background: var(--hero-card-bg);
  border: 1px solid var(--hero-border);
  border-radius: var(--hero-radius);
  padding: 20px;
}

.cal-grid-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.cal-grid-month {
  font-family: var(--hero-font);
  font-size: 18px; font-weight: 700;
}
.cal-grid-nav { display: flex; gap: 6px; }
.cal-grid-nav button {
  width: 32px; height: 32px;
  border-radius: 6px;
  border: 1px solid var(--hero-border);
  background: var(--hero-card-bg);
  color: var(--hero-text);
  cursor: pointer;
  font-size: 14px;
  transition: all 0.15s;
}
.cal-grid-nav button:hover { border-color: var(--hero-primary); color: var(--hero-primary); }

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  margin-bottom: 6px;
}
.cal-weekdays div {
  text-align: center;
  font-size: 11px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--hero-text-subtle);
  padding: 6px 0;
}

.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }

.cal-day {
  background: var(--hero-bg);
  border: 1px solid transparent;
  border-radius: var(--hero-radius-sm);
  min-height: 110px;
  padding: 8px;
  transition: border-color 0.15s;
  position: relative;
  min-width: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.cal-day:hover { border-color: var(--hero-primary); }
.cal-day.empty { background: transparent; pointer-events: none; }
.cal-day.today { border-color: var(--hero-primary); background: var(--hero-primary-50); }

.cal-day-num {
  font-size: 13px; font-weight: 700;
  color: var(--hero-text);
  margin-bottom: 4px;
  flex-shrink: 0;
}
.cal-day.today .cal-day-num {
  background: var(--hero-primary); color: #fff;
  width: 22px; height: 22px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
}

.cal-day-events {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  overflow: hidden;
}

.cal-pill {
  display: block;
  font-size: 10.5px; font-weight: 700;
  padding: 3px 6px;
  border-radius: 4px;
  cursor: pointer;
  border: none;
  text-align: left;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  box-sizing: border-box;
  overflow: hidden;
  transition: filter 0.15s;
  line-height: 1.25;
}
.cal-pill .pill-title {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cal-pill:hover { filter: brightness(0.9); }
.cal-pill.aca      { background: rgba(6,163,182,0.15);  color: var(--cat-aca);      border-left: 2px solid var(--cat-aca); }
.cal-pill.medicare { background: rgba(0,101,243,0.15);  color: var(--cat-medicare); border-left: 2px solid var(--cat-medicare); }
.cal-pill.supp     { background: rgba(34,160,107,0.15); color: var(--cat-supp);     border-left: 2px solid var(--cat-supp); }
.cal-pill.life     { background: rgba(232,163,23,0.18); color: #b07a0e;             border-left: 2px solid var(--cat-life); }
.cal-pill .pill-time {
  display: block;
  font-weight: 400;
  font-size: 9.5px;
  opacity: 0.85;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cal-pill.hidden { display: none; }

.cal-day-more {
  font-size: 10px;
  font-weight: 700;
  color: var(--hero-text-muted);
  padding: 2px 6px;
  cursor: pointer;
  background: none;
  border: none;
  text-align: left;
  width: 100%;
  border-radius: 4px;
}
.cal-day-more:hover { color: var(--hero-primary); background: rgba(6,163,182,0.05); }

/* ════════════════════════════════════════════════════
   ERROR BANNER
   ════════════════════════════════════════════════════ */
.error-banner {
  display: none;
  margin: 0 0 16px;
  background: rgba(214,69,69,0.08);
  border: 1px solid rgba(214,69,69,0.25);
  border-radius: var(--hero-radius);
  padding: 12px 16px;
  font-size: 13px;
  color: var(--hero-danger);
}
.error-banner.show { display: block; }

/* ════════════════════════════════════════════════════
   MODAL
   ════════════════════════════════════════════════════ */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(26,39,51,0.4);
  backdrop-filter: blur(4px);
  z-index: 500;
  align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--hero-card-bg);
  border-radius: var(--hero-radius-lg);
  padding: 32px;
  max-width: 480px; width: 100%;
  position: relative;
  animation: modalIn 0.22s ease;
  box-shadow: var(--hero-shadow-lg);
  max-height: 90vh; overflow-y: auto;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96) translateY(8px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-close {
  position: absolute; top: 14px; right: 14px;
  width: 32px; height: 32px;
  border-radius: 6px;
  background: var(--hero-bg);
  border: none;
  color: var(--hero-text-muted);
  font-size: 18px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--hero-border); color: var(--hero-text); }

.modal-badges { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.modal-cat-badge {
  display: inline-flex; align-items: center;
  font-size: 11px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  padding: 4px 12px;
  border-radius: 100px;
}
.modal-cat-badge.aca      { background: rgba(6,163,182,0.12);  color: var(--cat-aca); }
.modal-cat-badge.medicare { background: rgba(0,101,243,0.12);  color: var(--cat-medicare); }
.modal-cat-badge.supp     { background: rgba(34,160,107,0.12); color: var(--cat-supp); }
.modal-cat-badge.life     { background: rgba(232,163,23,0.15); color: #b07a0e; }

.modal-lang-badge {
  display: inline-flex; align-items: center;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.5px;
  padding: 4px 12px;
  border-radius: 100px;
}
.modal-lang-badge.es { background: #fff5d6; color: #856404; }
.modal-lang-badge.en { background: #d6e4ff; color: #084298; }
.modal-lang-badge.hidden { display: none; }

.modal h2 {
  font-family: var(--hero-font);
  font-size: 22px; font-weight: 800;
  color: var(--hero-text);
  margin-bottom: 18px;
  line-height: 1.25;
  padding-right: 30px;
}

.modal-meta { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.modal-meta .meta-row {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 13.5px;
  color: var(--hero-text);
}
.modal-meta .meta-row svg { width: 16px; height: 16px; color: var(--hero-text-muted); margin-top: 1px; flex-shrink: 0; }
.modal-meta .meta-row b { font-weight: 700; }
.modal-meta .meta-row small { color: var(--hero-text-muted); font-size: 11.5px; margin-left: 4px; }

.modal-desc {
  font-size: 13.5px;
  color: var(--hero-text-muted);
  line-height: 1.65;
  padding: 14px 0;
  border-top: 1px solid var(--hero-border-soft);
}

.modal-actions { display: flex; flex-direction: column; gap: 8px; }

.modal-link-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--hero-primary); color: #fff;
  font-family: var(--hero-font);
  font-size: 14px; font-weight: 700;
  padding: 12px 20px;
  border-radius: var(--hero-radius-sm);
  text-decoration: none; border: none;
  cursor: pointer; transition: all 0.15s;
  width: 100%;
}
.modal-link-btn:hover { background: var(--hero-primary-dark); transform: translateY(-1px); }
.modal-link-btn.hidden { display: none; }

/* CALENDAR PICKER */
.cal-picker { position: relative; width: 100%; }
.cal-picker-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 11px 20px;
  background: var(--hero-card-bg); color: var(--hero-primary);
  font-family: var(--hero-font); font-size: 13px; font-weight: 700;
  border: 1.5px solid var(--hero-primary); border-radius: var(--hero-radius-sm);
  cursor: pointer; transition: all 0.15s;
}
.cal-picker-btn:hover { background: var(--hero-primary-50); }
.cal-picker-btn .arrow { font-size: 9px; margin-left: auto; transition: transform 0.2s; }
.cal-picker-btn.open .arrow { transform: rotate(180deg); }

.cal-dropdown {
  display: none;
  flex-direction: column;
  position: absolute; bottom: calc(100% + 6px); left: 0; right: 0;
  background: var(--hero-card-bg);
  border: 1px solid var(--hero-border);
  border-radius: var(--hero-radius);
  box-shadow: var(--hero-shadow-lg);
  overflow: hidden; z-index: 10;
  animation: dropUp 0.18s ease;
}
.cal-dropdown.open { display: flex; }
@keyframes dropUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

.cal-option {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  font-family: var(--hero-font); font-size: 13px; font-weight: 600;
  color: var(--hero-text);
  text-decoration: none; border: none; background: none;
  cursor: pointer; transition: background 0.15s;
  border-bottom: 1px solid var(--hero-border-soft);
  text-align: left;
}
.cal-option:last-child { border-bottom: none; }
.cal-option:hover { background: var(--hero-bg); }
.cal-option-icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cal-option-label { display: flex; flex-direction: column; }
.cal-option-label span { font-size: 11px; color: var(--hero-text-subtle); font-weight: 400; margin-top: 1px; }

/* ════════════════════════════════════════════════════
   FOOTER
   ════════════════════════════════════════════════════ */
.hero-footer {
  background: var(--hero-card-bg);
  border-top: 1px solid var(--hero-border);
  margin-top: 40px;
}
.hero-footer-inner {
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px 32px;
  display: flex; justify-content: space-between;
  color: var(--hero-text-muted);
  font-size: 13px;
}

/* ════════════════════════════════════════════════════
   RESPONSIVE
   ════════════════════════════════════════════════════ */
@media (max-width: 1024px) {
  .main { grid-template-columns: 1fr; }
  .sidebar { position: static; }
}

@media (max-width: 720px) {
  .topbar { padding: 0 16px; height: 56px; }
  .topbar-divider, .topbar-breadcrumb { display: none; }
  .topbar-logo img { height: 32px; }
  .view-toggle button { padding: 6px 8px; font-size: 11px; }

  .hero-banner { padding: 22px 16px; }
  .banner-inner { grid-template-columns: 1fr; gap: 18px; }
  .banner-right { align-items: flex-start; width: 100%; }
  .countdown-card { width: 100%; min-width: 0; }

  .main { padding: 20px 16px 40px; }

  .training-card {
    grid-template-columns: 56px 1fr;
    gap: 14px;
  }
  .training-card .actions { grid-column: 1 / -1; flex-direction: row; }

  .hero-footer-inner { padding: 14px 16px; flex-direction: column; gap: 4px; text-align: center; }

  .cal-day { min-height: 70px; padding: 4px; }
  .cal-pill { font-size: 9px; padding: 2px 4px; }
  .cal-pill .pill-time { display: none; }
  .cal-day-more { font-size: 9px; padding: 1px 4px; }
}
</style>
</head>
<body>

<!-- ═══════════ TOPBAR ═══════════ -->
<header class="topbar">
  <div class="topbar-logo">
    <img src="hero-logo-transparent.png" alt="Hero Insurance">
  </div>
  <div class="topbar-divider"></div>
  <div class="topbar-breadcrumb">
    <span data-i18n="breadcrumb-tools">Herramientas</span>
    <span>/</span>
    <b data-i18n="breadcrumb-tc">Training Calendar</b>
  </div>
  <div class="topbar-right">
    <div class="view-toggle">
      <button id="view-list" class="active">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span data-i18n="view-list">Lista</span>
      </button>
      <button id="view-grid">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span data-i18n="view-grid">Mes</span>
      </button>
    </div>
    <div class="lang-switcher">
      <button class="lang-btn active" data-lang="es">ES</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>
</header>

<!-- ═══════════ HERO BANNER ═══════════ -->
<section class="hero-banner" id="hero-banner">
  <!-- Filled dynamically -->
</section>

<!-- ═══════════ MAIN ═══════════ -->
<main class="main">

  <!-- Error banner spans full -->
  <div class="error-banner" id="error-banner" data-i18n="error-msg" style="grid-column: 1 / -1;">
    ⚠️ No se pudo conectar con Google Sheets. Verifica que el Apps Script esté publicado y con acceso público.
  </div>

  <!-- ─── LIST VIEW (default) ─── -->
  <div class="list-view" id="list-view">

    <!-- Left: Training list -->
    <section>
      <div class="section-head">
        <h2>
          <span id="list-title" data-i18n="upcoming-title">Próximos Trainings</span>
          <span class="count" id="list-count">0</span>
        </h2>
        <div class="sync-bar">
          <div class="sync-dot loading" id="sync-dot"></div>
          <span id="sync-label"></span>
        </div>
      </div>

      <!-- Filter chips on mobile/desktop -->
      <div class="filters-row" id="filters-row">
        <button class="filter-chip active" data-filter="all" data-i18n="filter-all">Todos</button>
        <button class="filter-chip" data-filter="aca"><span class="dot"></span>ACA</button>
        <button class="filter-chip" data-filter="medicare"><span class="dot"></span>Medicare</button>
        <button class="filter-chip" data-filter="supp"><span class="dot"></span><span data-i18n="cat-supp">Supplemental</span></button>
        <button class="filter-chip" data-filter="life"><span class="dot"></span><span data-i18n="cat-life">Life</span></button>
      </div>

      <div class="training-list" id="training-list">
        <!-- Skeletons during load -->
      </div>
    </section>

    <!-- Right: Sidebar -->
    <aside class="sidebar" id="sidebar">

      <!-- Mini calendar -->
      <div class="side-card">
        <h3>
          <span id="mini-cal-month"></span>
          <div class="nav-arrows">
            <button id="mini-prev">‹</button>
            <button id="mini-next">›</button>
          </div>
        </h3>
        <div class="mini-cal-weekdays" id="mini-weekdays">
          <div></div><div></div><div></div><div></div><div></div><div></div><div></div>
        </div>
        <div class="mini-cal-grid" id="mini-cal-grid"></div>
      </div>

      <!-- Filter list -->
      <div class="side-card">
        <h3 data-i18n="categories">Categorías</h3>
        <div class="filter-list" id="filter-list">
          <button class="filter-list-item active" data-filter="all">
            <span class="swatch all"></span>
            <span data-i18n="filter-all">Todos</span>
            <span class="num" id="num-all">0</span>
          </button>
          <button class="filter-list-item" data-filter="aca">
            <span class="swatch aca"></span>
            <span>ACA</span>
            <span class="num" id="num-aca">0</span>
          </button>
          <button class="filter-list-item" data-filter="medicare">
            <span class="swatch medicare"></span>
            <span>Medicare</span>
            <span class="num" id="num-medicare">0</span>
          </button>
          <button class="filter-list-item" data-filter="supp">
            <span class="swatch supp"></span>
            <span data-i18n="cat-supp">Supplemental</span>
            <span class="num" id="num-supp">0</span>
          </button>
          <button class="filter-list-item" data-filter="life">
            <span class="swatch life"></span>
            <span data-i18n="cat-life">Life</span>
            <span class="num" id="num-life">0</span>
          </button>
        </div>
      </div>

    </aside>
  </div>

  <!-- ─── GRID VIEW ─── -->
  <div class="grid-view" id="grid-view">
    <div class="calendar-grid-wrap">
      <div class="cal-grid-header">
        <div class="cal-grid-month" id="grid-month"></div>
        <div class="cal-grid-nav">
          <button id="grid-prev">‹</button>
          <button id="grid-today" data-i18n="today-btn">Hoy</button>
          <button id="grid-next">›</button>
        </div>
      </div>
      <div class="cal-weekdays" id="cal-weekdays-row">
        <div></div><div></div><div></div><div></div><div></div><div></div><div></div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>

</main>

<!-- ═══════════ MODAL ═══════════ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close">×</button>
    <div class="modal-badges">
      <div class="modal-cat-badge" id="modal-badge"></div>
      <div class="modal-lang-badge hidden" id="modal-lang-badge"></div>
    </div>
    <h2 id="modal-title"></h2>
    <div class="modal-meta">
      <div class="meta-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <div><b id="modal-date"></b></div>
      </div>
      <div class="meta-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <div id="modal-time"></div>
      </div>
      <div class="meta-row" id="modal-time-converted-row" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <div id="modal-time-converted"></div>
      </div>
      <div class="meta-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <div id="modal-instructor"></div>
      </div>
    </div>
    <div class="modal-desc" id="modal-desc"></div>
    <div class="modal-actions">
      <a class="modal-link-btn hidden" id="modal-link" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span data-i18n="join-btn">Unirse al Meeting</span>
      </a>

      <div class="cal-picker" id="cal-picker">
        <button class="cal-picker-btn" id="cal-picker-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span data-i18n="reminder-btn">Agregar al Calendario</span>
          <span class="arrow">▼</span>
        </button>
        <div class="cal-dropdown" id="cal-dropdown">
          <a class="cal-option" id="cal-google" target="_blank" rel="noopener">
            <div class="cal-option-icon">
              <svg width="22" height="22" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285F4" d="M45.5 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h12.1c-.5 2.7-2.1 5-4.4 6.5v5.4h7.1c4.2-3.8 6.7-9.5 6.7-15.6z"/>
                <path fill="#34A853" d="M24 46c6 0 11-2 14.7-5.4l-7.1-5.4c-2 1.3-4.5 2.1-7.6 2.1-5.8 0-10.8-3.9-12.5-9.2H4.1v5.6C7.8 41.9 15.4 46 24 46z"/>
                <path fill="#FBBC05" d="M11.5 28.1c-.5-1.3-.7-2.7-.7-4.1s.3-2.8.7-4.1v-5.6H4.1C2.5 17.4 2 20.6 2 24s.5 6.6 2.1 9.7l7.4-5.6z"/>
                <path fill="#EA4335" d="M24 9.7c3.3 0 6.2 1.1 8.5 3.3l6.3-6.3C34.9 3.2 29.8 1 24 1 15.4 1 7.8 5.1 4.1 11.9l7.4 5.6C13.2 13.6 18.2 9.7 24 9.7z"/>
              </svg>
            </div>
            <div class="cal-option-label">Google Calendar<span data-i18n="cal-opens-browser">Abre en el navegador</span></div>
          </a>

      'months':            ['January','February','March','April','May','June','July','August','September','October','November','December'],
      'months-short':      ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
      'weekdays':          ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
      'weekdays-short':    ['S','M','T','W','T','F','S'],
      'weekdays-grid':     ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
      'date-format':       (d,m,y) => `${m} ${d}, ${y}`,
      'type-labels':       { aca: 'ACA', medicare: 'Medicare', supp: 'Supplemental', life: 'Life Insurance' },
    }
  };

  const LS_KEY_LANG = 'hero-tc-lang';
  const LS_KEY_VIEW = 'hero-tc-view';
  const storedLang = (() => { try { return localStorage.getItem(LS_KEY_LANG); } catch { return null; } })();
  let currentLang = (storedLang === 'es' || storedLang === 'en') ? storedLang : 'es';
  function t(key) { return I18N[currentLang][key] !== undefined ? I18N[currentLang][key] : I18N['es'][key] || key; }

  function applyTranslations(rerender = true) {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (key === 'error-msg') { el.innerHTML = t(key); return; }
      el.textContent = t(key);
    });
    document.documentElement.lang = currentLang;

    // Mini cal weekdays
    const mw = document.getElementById('mini-weekdays');
    if (mw) mw.querySelectorAll('div').forEach((el,i) => el.textContent = t('weekdays-short')[i]);

    // Grid weekdays
    const gw = document.getElementById('cal-weekdays-row');
    if (gw) gw.querySelectorAll('div').forEach((el,i) => el.textContent = t('weekdays-grid')[i]);

    if (rerender) {
      renderHeroBanner();
      renderTrainingList();
      renderMiniCal();
      renderGridView();
      updateCounts();
    }
  }

  // ═════════════ TIMEZONE ═════════════
  const TZ_ABBR = {
    'EST':'America/New_York','EDT':'America/New_York',
    'CST':'America/Chicago','CDT':'America/Chicago',
    'MST':'America/Denver','MDT':'America/Denver',
    'PST':'America/Los_Angeles','PDT':'America/Los_Angeles',
    'HST':'Pacific/Honolulu',
    'COT':'America/Bogota','PET':'America/Lima','VET':'America/Caracas',
    'ART':'America/Argentina/Buenos_Aires','BRT':'America/Sao_Paulo','CLT':'America/Santiago',
    'CET':'Europe/Madrid','GMT':'Europe/London','UTC':'UTC',
  };
  const TZ_LABELS = {
    'America/New_York':'ET (New York)','America/Chicago':'CT (Chicago)',
    'America/Denver':'MT (Denver)','America/Los_Angeles':'PT (Los Angeles)',
    'America/Bogota':'COT (Bogotá)','America/Lima':'PET (Lima)','America/Caracas':'VET',
    'America/Sao_Paulo':'BRT','America/Santiago':'CLT','Europe/Madrid':'CET',
    'Europe/London':'GMT','Pacific/Honolulu':'HST',
  };
  function resolveTimezone(tz){if(!tz)return'';const u=tz.trim().toUpperCase();return TZ_ABBR[u]||tz.trim();}
  function getTZLabel(iana){return TZ_LABELS[iana]||iana;}

  function convertToMiami(timeStr, dateStr, fromTZ) {
    if (!timeStr || !fromTZ) return null;
    try {
      const parts = timeStr.split(/\s*[–-]\s*/).map(s => s.trim()).filter(Boolean);
      const converted = parts.map(part => {
        const match = part.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
        if (!match) return null;
        let [, h, m, mer] = match;
        h = parseInt(h); m = parseInt(m);
        if (mer.toUpperCase() === 'PM' && h !== 12) h += 12;
        if (mer.toUpperCase() === 'AM' && h === 12) h = 0;
        const isoStr = `${dateStr}T${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00`;
        const srcDate = new Date(new Date(isoStr).toLocaleString('en-US', { timeZone: fromTZ }));
        const diff = new Date(isoStr) - srcDate;
        return new Date(new Date(isoStr).getTime() + diff).toLocaleString('en-US', {
          timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit', hour12: true
        });
      });
      if (converted.includes(null)) return null;
      return converted.join(' – ');
    } catch(e) { return null; }
  }

  // ═════════════ STATE ═════════════
  let EVENTS = [];
  let activeFilter = 'all';
  let currentView = 'list'; // 'list' | 'grid'
  let miniYear = new Date().getFullYear();
  let miniMonth = new Date().getMonth();
  let gridYear = new Date().getFullYear();
  let gridMonth = new Date().getMonth();
  let selectedDate = null; // YYYY-MM-DD

  // ═════════════ FETCH ═════════════
  function setSyncStatus(state, key, extra) {
    document.getElementById('sync-dot').className = 'sync-dot ' + state;
    document.getElementById('sync-label').textContent = extra ? `${t(key)} · ${extra}` : t(key);
  }

  async function loadEvents(silent = false) {
    if (!silent) {
      setSyncStatus('loading', 'sync-loading');
      renderSkeletons();
    }
    try {
      const res = await fetch(SHEETS_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      EVENTS = data.map(row => ({
        date:       String(row.date       || '').trim(),
        title:      String(row.title      || '').trim(),
        type:       String(row.type       || 'aca').trim().toLowerCase(),
        time:       String(row.time       || '').trim(),
        instructor: String(row.instructor || '').trim(),
        desc:       String(row.desc       || '').trim(),
        link:       String(row.link       || '').trim(),
        timezone:   String(row.timezone   || '').trim(),
        lang:       String(row.lang       || '').trim().toLowerCase(),
      })).filter(e => e.date && e.title)
        .map(e => ({ ...e, _dateStr: normalizeDate(e.date) }));
      const startOfToday = new Date(); startOfToday.setHours(0,0,0,0);
      const count = EVENTS.filter(e => new Date(e._dateStr + 'T00:00:00') >= startOfToday).length;
      const word  = count === 1 ? t('event') : t('events');
      setSyncStatus('ok', 'sync-ok', `${count} ${word}`);
      document.getElementById('error-banner').classList.remove('show');
    } catch(err) {
      setSyncStatus('error', 'sync-error');
      document.getElementById('error-banner').classList.add('show');
    }
    renderHeroBanner();
    renderTrainingList();
    renderMiniCal();
    renderGridView();
    updateCounts();
  }

  function normalizeDate(val) {
    if (!val) return '';
    const s = String(val).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const d = new Date(s);
    if (!isNaN(d)) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    return s;
  }

  function renderSkeletons() {
    const list = document.getElementById('training-list');
    list.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      const sk = document.createElement('div');
      sk.className = 'skeleton-card';
      list.appendChild(sk);
    }
  }

  // ═════════════ HERO BANNER ═════════════
  function renderHeroBanner() {
    const banner = document.getElementById('hero-banner');
    const now = new Date();

    // Find next event (today or future). Use full datetime if time available
    const candidates = EVENTS.map(ev => {
      const nd = ev._dateStr;
      const startTime = parseTimeToHHMM((ev.time || '12:00 AM').split(/[–-]/)[0].trim()) || { h: 0, m: 0 };
      const startDate = new Date(`${nd}T${String(startTime.h).padStart(2,'0')}:${String(startTime.m).padStart(2,'0')}:00`);

      // Estimate end time
      let endDate = new Date(startDate.getTime() + 60*60*1000);
      const parts = (ev.time || '').split(/[–-]/).map(s => s.trim());
      if (parts.length === 2) {
        const t1 = parseTimeToHHMM(parts[0]);
        const t2 = parseTimeToHHMM(parts[1]);
        if (t1 && t2) {
          let diff = (t2.h*60+t2.m) - (t1.h*60+t1.m);
          if (diff < 0) diff += 24*60;
          endDate = new Date(startDate.getTime() + diff*60*1000);
        }
      }
      return { ev, startDate, endDate };
    });

    // Find an event in progress first
    const inProgress = candidates.find(c => c.startDate <= now && now < c.endDate);
    const upcoming = candidates.filter(c => c.startDate > now).sort((a,b) => a.startDate - b.startDate);
    const featured = inProgress || upcoming[0] || null;

    if (!featured) {
      banner.innerHTML = `
        <div class="banner-inner">
          <div class="banner-empty">
            <h2>${t('no-events-banner')}</h2>
            <p>${t('no-events-banner-sub')}</p>
          </div>
        </div>
      `;
      return;
    }

    const { ev, startDate } = featured;
    const isLive = inProgress != null;
    const nd = ev._dateStr;
    const [y,m,d] = nd.split('-');
    const monthName = t('months')[parseInt(m)-1];

    // Countdown
    const diffMs = startDate - now;
    let countNum, countLabel;
    if (isLive) {
      countNum = '🔴'; countLabel = t('in-progress');
    } else {
      const diffDays = Math.floor(diffMs / (1000*60*60*24));
      const diffHours = Math.floor(diffMs / (1000*60*60));
      const diffMins = Math.floor(diffMs / (1000*60));
      if (diffDays >= 1) {
        countNum = diffDays;
        countLabel = diffDays === 1 ? t('day') : t('days');
      } else if (diffHours >= 1) {
        countNum = diffHours;
        countLabel = diffHours === 1 ? t('hour') : t('hours');
      } else {
        countNum = diffMins;
        countLabel = t('minutes');
      }
    }

    const tagText = isLive ? t('now-chip') : t('next-training');
    const tagColor = isLive ? '#d64545' : '#06a3b6';

    const bannerMeetingURL = safeLink(ev.link);
    const linkBtn = bannerMeetingURL
      ? `<a href="${escapeHTML(bannerMeetingURL)}" target="_blank" rel="noopener" class="btn-primary">
           <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
           ${t('join')}
         </a>` : '';

    banner.innerHTML = `
      <div class="banner-inner">
        <div class="banner-left">
          <div class="label-tag" style="${isLive ? 'background:rgba(214,69,69,0.1);color:#d64545' : ''}">
            <span class="dot" style="background:${tagColor}"></span>
            ${tagText}
          </div>
          <h1>${escapeHTML(ev.title)}</h1>
          <div class="next-meta">
            <span><b>${t('date-format')(d, monthName, y)}</b></span>
            ${ev.time ? `<span>${escapeHTML(ev.time)}</span>` : ''}
            ${ev.instructor ? `<span>${t('instructor')}: <b>${escapeHTML(ev.instructor)}</b></span>` : ''}
          </div>
        </div>
        <div class="banner-right">
          <div class="countdown-card">
            <div class="count-num">${countNum}</div>
            <div class="count-label">${countLabel}</div>
          </div>
          <div class="banner-actions">
            <button class="btn-secondary" data-action="add-to-cal">
              ${t('add-to-cal')}
            </button>
            ${linkBtn}
          </div>
        </div>
      </div>
    `;
    const addBtn = banner.querySelector('[data-action="add-to-cal"]');
    if (addBtn) addBtn.addEventListener('click', () => openModal(ev));
  }

  function escapeHTML(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]); }

  // ═════════════ TRAINING LIST ═════════════
  function renderTrainingList() {
    const list = document.getElementById('training-list');
    list.innerHTML = '';
    const now = new Date(); now.setHours(0,0,0,0);

    // Filter: by activeFilter, by selectedDate (if any), and only future
    let filtered = EVENTS.filter(e => {
      const d = new Date(e._dateStr + 'T00:00:00');
      if (selectedDate) return e._dateStr === selectedDate && (activeFilter === 'all' || e.type === activeFilter);
      return d >= now && (activeFilter === 'all' || e.type === activeFilter);
    });

    filtered.sort((a,b) => a._dateStr.localeCompare(b._dateStr));
    document.getElementById('list-count').textContent = filtered.length;

    if (!filtered.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">📭</div>
          <h3>${t('no-trainings')}</h3>
          <p>${t('no-trainings-sub')}</p>
        </div>
      `;
      return;
    }

    // Find next (first future event regardless of selectedDate)
    const nextEvent = EVENTS
      .filter(e => new Date(e._dateStr + 'T00:00:00') >= now && (activeFilter === 'all' || e.type === activeFilter))
      .sort((a,b) => a._dateStr.localeCompare(b._dateStr))[0];

    filtered.forEach(ev => {
      const card = createTrainingCard(ev, ev === nextEvent);
      list.appendChild(card);
    });
  }

  function createTrainingCard(ev, isNext) {
    const nd = ev._dateStr;
    const [y,m,d] = nd.split('-');
    const dateObj = new Date(nd + 'T00:00:00');
    const monthShort = t('months-short')[parseInt(m)-1];
    const weekdayShort = t('weekdays-short')[dateObj.getDay()];
    const typeLabels = t('type-labels');

    // Live check
    const now = new Date();
    let isLive = false;
    if (ev.time) {
      const startT = parseTimeToHHMM(ev.time.split(/[–-]/)[0].trim());
      const parts = ev.time.split(/[–-]/).map(s => s.trim());
      if (startT) {
        const startDate = new Date(`${nd}T${String(startT.h).padStart(2,'0')}:${String(startT.m).padStart(2,'0')}:00`);
        let endDate = new Date(startDate.getTime() + 60*60*1000);
        if (parts.length === 2) {
          const t2 = parseTimeToHHMM(parts[1]);
          if (t2) {
            let diff = (t2.h*60+t2.m) - (startT.h*60+startT.m);
            if (diff < 0) diff += 24*60;
            endDate = new Date(startDate.getTime() + diff*60*1000);
          }
        }
        isLive = startDate <= now && now < endDate;
      }
    }

    const card = document.createElement('div');
    card.className = `training-card ${ev.type}`;
    const cardMeetingURL = safeLink(ev.link);

    let chips = `<span class="cat-chip ${ev.type}">${typeLabels[ev.type] || ev.type.toUpperCase()}</span>`;
    if (ev.lang === 'es' || ev.lang === 'en') chips += `<span class="lang-chip ${ev.lang}">${ev.lang.toUpperCase()}</span>`;
    if (isLive) chips += `<span class="now-chip">${t('now-chip')}</span>`;
    else if (isNext) chips += `<span class="next-chip">${t('next-chip')}</span>`;

    let info = '';
    if (ev.time) info += `<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${escapeHTML(ev.time)}</span>`;
    if (ev.instructor) info += `<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> ${escapeHTML(ev.instructor)}</span>`;

    card.innerHTML = `
      <div class="date-block">
        <div class="day">${parseInt(d)}</div>
        <div class="month">${monthShort}</div>
        <div class="weekday">${weekdayShort}</div>
      </div>
      <div class="body">
        <div class="meta-row">${chips}</div>
        <h3>${escapeHTML(ev.title)}</h3>
        <div class="info">${info}</div>
      </div>
      <div class="actions">
        ${cardMeetingURL ? `<a class="btn-primary" href="${escapeHTML(cardMeetingURL)}" target="_blank" rel="noopener" data-action="join"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>${t('join')}</a>` : ''}
        <button class="btn-secondary" data-action="add-to-cal"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>${t('add-to-cal')}</button>
      </div>
    `;

    card.addEventListener('click', () => openModal(ev));
    const joinLink = card.querySelector('[data-action="join"]');
    if (joinLink) joinLink.addEventListener('click', e => e.stopPropagation());
    const calBtn = card.querySelector('[data-action="add-to-cal"]');
    calBtn.addEventListener('click', e => { e.stopPropagation(); openModal(ev); });
    return card;
  }

  // ═════════════ MINI CALENDAR ═════════════
  function renderMiniCal() {
    const grid = document.getElementById('mini-cal-grid');
    grid.innerHTML = '';
    document.getElementById('mini-cal-month').textContent = `${t('months-short')[miniMonth]} ${miniYear}`;

    const firstDay = new Date(miniYear, miniMonth, 1).getDay();
    const days = new Date(miniYear, miniMonth + 1, 0).getDate();
    const today = new Date();

    for (let i = 0; i < firstDay; i++) {
      const cell = document.createElement('div');
      cell.className = 'mini-day empty';
      grid.appendChild(cell);
    }

    for (let d = 1; d <= days; d++) {
      const dateStr = `${miniYear}-${String(miniMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const events = EVENTS.filter(e => e._dateStr === dateStr && (activeFilter === 'all' || e.type === activeFilter));
      const isToday = today.getDate() === d && today.getMonth() === miniMonth && today.getFullYear() === miniYear;

      const cell = document.createElement('div');
      cell.className = 'mini-day';
      if (isToday) cell.classList.add('today');
      if (selectedDate === dateStr) cell.classList.add('selected');
      if (events.length) cell.classList.add('has-events');

      let dotsHTML = '';
      if (events.length) {
        const types = [...new Set(events.map(e => e.type))].slice(0, 3);
        dotsHTML = '<div class="dots">' + types.map(ty => `<span style="background:var(--cat-${ty})"></span>`).join('') + '</div>';
      } else {
        dotsHTML = '<div class="dots"></div>';
      }
      cell.innerHTML = `<div>${d}</div>${dotsHTML}`;

      cell.addEventListener('click', () => {
        if (selectedDate === dateStr) {
          selectedDate = null;
        } else {
          selectedDate = dateStr;
        }
        renderMiniCal();
        renderTrainingList();
      });

      grid.appendChild(cell);
    }
  }

  // ═════════════ GRID VIEW ═════════════
  function renderGridView() {
    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
    document.getElementById('grid-month').textContent = `${t('months')[gridMonth]} ${gridYear}`;

    const firstDay = new Date(gridYear, gridMonth, 1).getDay();
    const days = new Date(gridYear, gridMonth + 1, 0).getDate();
    const today = new Date();

    for (let i = 0; i < firstDay; i++) {
      const cell = document.createElement('div');
      cell.className = 'cal-day empty';
      grid.appendChild(cell);
    }

    for (let d = 1; d <= days; d++) {
      const isToday = today.getDate() === d && today.getMonth() === gridMonth && today.getFullYear() === gridYear;
      const cell = document.createElement('div');
      cell.className = 'cal-day' + (isToday ? ' today' : '');
      const dateStr = `${gridYear}-${String(gridMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const events = EVENTS.filter(e => e._dateStr === dateStr);

      const numEl = document.createElement('div');
      numEl.className = 'cal-day-num';
      numEl.textContent = d;
      cell.appendChild(numEl);

      const eventsContainer = document.createElement('div');
      eventsContainer.className = 'cal-day-events';

      // Show max 3 events; collapse rest into "+N más"
      const visibleEvents = events.filter(ev => activeFilter === 'all' || activeFilter === ev.type);
      const MAX_VISIBLE = 3;
      const shown = visibleEvents.slice(0, MAX_VISIBLE);
      const hidden = visibleEvents.slice(MAX_VISIBLE);

      shown.forEach(ev => {
        const pill = document.createElement('button');
        pill.className = `cal-pill ${ev.type}`;
        pill.innerHTML = `<span class="pill-title">${escapeHTML(ev.title)}</span>` + (ev.time ? `<span class="pill-time">${escapeHTML(ev.time)}</span>` : '');
        pill.addEventListener('click', e => { e.stopPropagation(); openModal(ev); });
        eventsContainer.appendChild(pill);
      });

      if (hidden.length) {
        const moreBtn = document.createElement('button');
        moreBtn.className = 'cal-day-more';
        moreBtn.textContent = `+${hidden.length} ${currentLang === 'es' ? 'más' : 'more'}`;
        moreBtn.addEventListener('click', e => {
          e.stopPropagation();
          selectedDate = dateStr;
          miniYear = gridYear; miniMonth = gridMonth;
          switchView('list');
          renderTrainingList();
          renderMiniCal();
        });
        eventsContainer.appendChild(moreBtn);
      }

      cell.appendChild(eventsContainer);
      grid.appendChild(cell);
    }
  }

  // ═════════════ COUNTS ═════════════
  function updateCounts() {
    const now = new Date(); now.setHours(0,0,0,0);
    const future = EVENTS.filter(e => new Date(e._dateStr + 'T00:00:00') >= now);
    document.getElementById('num-all').textContent = future.length;
    document.getElementById('num-aca').textContent = future.filter(e => e.type === 'aca').length;
    document.getElementById('num-medicare').textContent = future.filter(e => e.type === 'medicare').length;
    document.getElementById('num-supp').textContent = future.filter(e => e.type === 'supp').length;
    document.getElementById('num-life').textContent = future.filter(e => e.type === 'life').length;
  }

  // ═════════════ ICS / GOOGLE CAL ═════════════
  function parseTimeToHHMM(timeStr) {
    if (!timeStr) return null;
    const first = timeStr.split(/[–-]/)[0].trim();
    const match = first.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
    if (!match) return null;
    let [, h, m, mer] = match;
    h = parseInt(h); m = parseInt(m);
    if (mer.toUpperCase() === 'PM' && h !== 12) h += 12;
    if (mer.toUpperCase() === 'AM' && h === 12) h = 0;
    return { h, m };
  }

  // Only allow http(s) URLs (block javascript:, data:, etc.)
  function safeLink(url) {
    if (!url) return '';
    const trimmed = String(url).trim();
    try {
      const u = new URL(trimmed);
      if (u.protocol === 'https:' || u.protocol === 'http:') return trimmed;
    } catch {}
    return '';
  }

  // Current UTC timestamp formatted for ICS DTSTAMP
  function nowUTCStamp() {
    const n = new Date();
    const pad = x => String(x).padStart(2,'0');
    return `${n.getUTCFullYear()}${pad(n.getUTCMonth()+1)}${pad(n.getUTCDate())}T${pad(n.getUTCHours())}${pad(n.getUTCMinutes())}${pad(n.getUTCSeconds())}Z`;
  }

  // VTIMEZONE block for America/New_York (covers EST/EDT)
  const VTIMEZONE_NY = [
    'BEGIN:VTIMEZONE',
    'TZID:America/New_York',
    'BEGIN:DAYLIGHT',
    'TZOFFSETFROM:-0500','TZOFFSETTO:-0400','TZNAME:EDT',
    'DTSTART:19700308T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU',
    'END:DAYLIGHT',
    'BEGIN:STANDARD',
    'TZOFFSETFROM:-0400','TZOFFSETTO:-0500','TZNAME:EST',
    'DTSTART:19701101T020000','RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU',
    'END:STANDARD',
    'END:VTIMEZONE',
  ].join('\r\n');

  // Emit Miami-local time as literal strings (paired with TZID=America/New_York).
  // Avoids floating-time bug where Outlook/Apple interpreted the event in the user's local zone.
  function toICSDate(dateStr, hhmm, durationHours = 1) {
    const pad = n => String(n).padStart(2, '0');
    const [y, mo, d] = dateStr.split('-').map(Number);
    const startMin = hhmm.h * 60 + hhmm.m;
    const endMin = startMin + Math.round(durationHours * 60);
    const endH = Math.floor(endMin / 60) % 24;
    const endM = endMin % 60;
    const dayOffset = Math.floor(endMin / (24 * 60));
    const endDate = new Date(Date.UTC(y, mo - 1, d + dayOffset));
    const start = `${y}${pad(mo)}${pad(d)}T${pad(hhmm.h)}${pad(hhmm.m)}00`;
    const end = `${endDate.getUTCFullYear()}${pad(endDate.getUTCMonth()+1)}${pad(endDate.getUTCDate())}T${pad(endH)}${pad(endM)}00`;
    return { start, end };
  }

  function getDuration(timeStr) {
    let durationHours = 1;
    const parts = (timeStr || '').split(/[–-]/).map(s => s.trim());
    if (parts.length === 2) {
      const t1 = parseTimeToHHMM(parts[0]);
      const t2 = parseTimeToHHMM(parts[1]);
      if (t1 && t2) {
        let diff = (t2.h*60+t2.m) - (t1.h*60+t1.m);
        if (diff < 0) diff += 24*60;
        durationHours = diff / 60;
      }
    }
    return durationHours;
  }

  function generateICS(ev) {
    const nd = ev._dateStr;
    const hhmm = parseTimeToHHMM(ev.time);
    if (!hhmm) return null;
    const durationHours = getDuration(ev.time);
    const { start, end } = toICSDate(nd, hhmm, durationHours);
    const uid = `hero-${nd}-${ev.title.replace(/\s+/g,'-').toLowerCase()}@heroinsuranceusa.com`;
    const category = t('type-labels')[ev.type] || ev.type.toUpperCase();
    const meetingURL = safeLink(ev.link);
    const descLines = [
      ev.desc,
      ev.instructor ? `Instructor: ${ev.instructor}` : '',
      ev.time ? `Time: ${ev.time} ET (Miami)` : '',
      meetingURL ? `Meeting Link: ${meetingURL}` : '',
    ].filter(Boolean).join('\\n');

    return [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Hero Insurance USA//Training Calendar//EN',
      'CALSCALE:GREGORIAN','METHOD:PUBLISH',
      VTIMEZONE_NY,
      'BEGIN:VEVENT',
      `UID:${uid}`,
      `DTSTAMP:${nowUTCStamp()}`,
      `DTSTART;TZID=America/New_York:${start}`,
      `DTEND;TZID=America/New_York:${end}`,
      `SUMMARY:${category} – ${ev.title}`,`DESCRIPTION:${descLines}`,
      meetingURL ? `LOCATION:${meetingURL}` : '',
      'BEGIN:VALARM','TRIGGER:-PT15M','ACTION:DISPLAY',
      `DESCRIPTION:Reminder: ${ev.title}`,'END:VALARM','END:VEVENT','END:VCALENDAR',
    ].filter(Boolean).join('\r\n');
  }

  function downloadICS(ev) {
    const ics = generateICS(ev);
    if (!ics) return;
    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `hero-training-${ev._dateStr}.ics`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function generateGoogleCalendarURL(ev) {
    const nd = ev._dateStr;
    const hhmm = parseTimeToHHMM(ev.time);
    if (!hhmm) return null;
    const durationHours = getDuration(ev.time);
    const { start, end } = toICSDate(nd, hhmm, durationHours);
    const title = encodeURIComponent(`${t('type-labels')[ev.type] || ev.type.toUpperCase()} – ${ev.title}`);
    const meetingURL = safeLink(ev.link);
    const details = encodeURIComponent([ev.desc, ev.instructor ? `Instructor: ${ev.instructor}` : '', meetingURL ? `Meeting: ${meetingURL}` : ''].filter(Boolean).join('\n'));
    const location = encodeURIComponent(meetingURL);
    return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${details}&location=${location}&ctz=America/New_York`;
  }

  // ═════════════ MODAL ═════════════
  function openModal(ev) {
    const nd = ev._dateStr;
    const [y,m,d] = nd.split('-');
    const monthName = t('months')[parseInt(m)-1];
    const typeLabels = t('type-labels');

    document.getElementById('modal-badge').textContent = typeLabels[ev.type] || ev.type.toUpperCase();
    document.getElementById('modal-badge').className = `modal-cat-badge ${ev.type}`;

    const langBadge = document.getElementById('modal-lang-badge');
    if (ev.lang === 'es' || ev.lang === 'en') {
      langBadge.textContent = ev.lang === 'es' ? '🇪🇸 Español' : '🇺🇸 English';
      langBadge.className = `modal-lang-badge ${ev.lang}`;
    } else langBadge.className = 'modal-lang-badge hidden';

    document.getElementById('modal-title').textContent = ev.title;
    document.getElementById('modal-date').textContent = t('date-format')(d, monthName, y);
    document.getElementById('modal-instructor').textContent = ev.instructor || '—';
    document.getElementById('modal-desc').textContent = ev.desc || '';

    // Time + timezone
    const convertedRow = document.getElementById('modal-time-converted-row');
    const ianaZone = resolveTimezone(ev.timezone);
    const isEastern = !ev.timezone || ['EST','EDT'].includes(ev.timezone.toUpperCase()) || ianaZone === 'America/New_York';

    if (!isEastern && ianaZone) {
      const converted = convertToMiami(ev.time, nd, ianaZone);
      document.getElementById('modal-time').innerHTML = `${escapeHTML(ev.time)} <small>${getTZLabel(ianaZone)}</small>`;
      if (converted) {
        document.getElementById('modal-time-converted').innerHTML = `${converted} <small>ET (Miami)</small>`;
        convertedRow.style.display = 'flex';
      } else convertedRow.style.display = 'none';
    } else {
      document.getElementById('modal-time').innerHTML = `${escapeHTML(ev.time || '')} <small>ET (Miami)</small>`;
      convertedRow.style.display = 'none';
    }

    // Link
    const linkBtn = document.getElementById('modal-link');
    const meetingURL = safeLink(ev.link);
    if (meetingURL) { linkBtn.href = meetingURL; linkBtn.classList.remove('hidden'); }
    else { linkBtn.href = '#'; linkBtn.classList.add('hidden'); }

    // Calendar picker
    const pickerBtn = document.getElementById('cal-picker-btn');
    const dropdown = document.getElementById('cal-dropdown');
    pickerBtn.classList.remove('open'); dropdown.classList.remove('open');
    pickerBtn.onclick = e => { e.stopPropagation(); pickerBtn.classList.toggle('open'); dropdown.classList.toggle('open'); };

    const googleURL = generateGoogleCalendarURL(ev);
    const googleBtn = document.getElementById('cal-google');
    if (googleURL) { googleBtn.href = googleURL; googleBtn.style.opacity = '1'; googleBtn.style.pointerEvents = ''; }
    else { googleBtn.href = '#'; googleBtn.style.opacity = '0.4'; googleBtn.style.pointerEvents = 'none'; }
    document.getElementById('cal-outlook').onclick = () => { downloadICS(ev); dropdown.classList.remove('open'); pickerBtn.classList.remove('open'); };
    document.getElementById('cal-apple').onclick = () => { downloadICS(ev); dropdown.classList.remove('open'); pickerBtn.classList.remove('open'); };

    document.getElementById('modal-overlay').classList.add('open');
  }

  // ═════════════ EVENTS ═════════════
  document.getElementById('modal-close').addEventListener('click', () => {
    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('cal-dropdown').classList.remove('open');
    document.getElementById('cal-picker-btn').classList.remove('open');
  });
  document.getElementById('modal-overlay').addEventListener('click', e => {
    const dropdown = document.getElementById('cal-dropdown');
    if (dropdown.classList.contains('open') && !e.target.closest('.cal-picker')) {
      dropdown.classList.remove('open');
      document.getElementById('cal-picker-btn').classList.remove('open');
      return;
    }
    if (e.target === document.getElementById('modal-overlay'))
      document.getElementById('modal-overlay').classList.remove('open');
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    const overlay = document.getElementById('modal-overlay');
    const dropdown = document.getElementById('cal-dropdown');
    if (dropdown.classList.contains('open')) {
      dropdown.classList.remove('open');
      document.getElementById('cal-picker-btn').classList.remove('open');
    } else if (overlay.classList.contains('open')) {
      overlay.classList.remove('open');
    }
  });

  // Mini cal nav
  document.getElementById('mini-prev').addEventListener('click', e => { e.stopPropagation(); miniMonth--; if (miniMonth<0){miniMonth=11;miniYear--;} renderMiniCal(); });
  document.getElementById('mini-next').addEventListener('click', e => { e.stopPropagation(); miniMonth++; if (miniMonth>11){miniMonth=0;miniYear++;} renderMiniCal(); });

  // Grid nav
  document.getElementById('grid-prev').addEventListener('click', () => { gridMonth--; if (gridMonth<0){gridMonth=11;gridYear--;} renderGridView(); });
  document.getElementById('grid-next').addEventListener('click', () => { gridMonth++; if (gridMonth>11){gridMonth=0;gridYear++;} renderGridView(); });
  document.getElementById('grid-today').addEventListener('click', () => { const n = new Date(); gridMonth = n.getMonth(); gridYear = n.getFullYear(); renderGridView(); });

  // Filters (chips and sidebar list)
  function setActiveFilter(filter) {
    activeFilter = filter;
    updateURLFilter(filter);
    document.querySelectorAll('.filter-chip').forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
    document.querySelectorAll('.filter-list-item').forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
    renderTrainingList();
    renderMiniCal();
    renderGridView();
  }
  document.querySelectorAll('.filter-chip, .filter-list-item').forEach(btn => {
    btn.addEventListener('click', () => setActiveFilter(btn.dataset.filter));
  });

  // View toggle
  document.getElementById('view-list').addEventListener('click', () => switchView('list'));
  document.getElementById('view-grid').addEventListener('click', () => switchView('grid'));
  function switchView(view, persist = true) {
    currentView = view;
    if (persist) { try { localStorage.setItem(LS_KEY_VIEW, view); } catch {} }
    document.getElementById('view-list').classList.toggle('active', view === 'list');
    document.getElementById('view-grid').classList.toggle('active', view === 'grid');
    document.getElementById('list-view').classList.toggle('hidden', view !== 'list');
    document.getElementById('sidebar').classList.toggle('hidden', view !== 'list');
    document.getElementById('grid-view').classList.toggle('active', view === 'grid');
  }

  // Lang switcher
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
    btn.addEventListener('click', () => {
      currentLang = btn.dataset.lang;
      try { localStorage.setItem(LS_KEY_LANG, currentLang); } catch {}
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
      applyTranslations();
    });
  });

  // ═════════════ URL PARAMS ═════════════
  // Read ?filter=aca|medicare|supp|life from URL on load
  function getInitialFilterFromURL() {
    const params = new URLSearchParams(window.location.search);
    const f = (params.get('filter') || params.get('product') || '').toLowerCase().trim();
    const valid = ['all', 'aca', 'medicare', 'supp', 'life'];
    return valid.includes(f) ? f : 'all';
  }

  // Update URL when filter changes (without reloading page)
  function updateURLFilter(filter) {
    const url = new URL(window.location);
    if (filter === 'all') {
      url.searchParams.delete('filter');
    } else {
      url.searchParams.set('filter', filter);
    }
    window.history.replaceState({}, '', url);
  }

  // Init
  applyTranslations(false);
  document.getElementById('sync-label').textContent = t('sync-loading');

  // Restore saved view
  const storedView = (() => { try { return localStorage.getItem(LS_KEY_VIEW); } catch { return null; } })();
  if (storedView === 'grid' || storedView === 'list') switchView(storedView, false);

  // Apply initial filter from URL BEFORE loading events
  const initialFilter = getInitialFilterFromURL();
  if (initialFilter !== 'all') {
    activeFilter = initialFilter;
    document.querySelectorAll('.filter-chip').forEach(b => b.classList.toggle('active', b.dataset.filter === initialFilter));
    document.querySelectorAll('.filter-list-item').forEach(b => b.classList.toggle('active', b.dataset.filter === initialFilter));
  }

  loadEvents();

  // Keep the hero banner's countdown live (re-renders every 30s)
  setInterval(renderHeroBanner, 30 * 1000);

  // Silent refresh of events every 5 minutes (no skeletons / no loading state)
  setInterval(() => loadEvents(true), 5 * 60 * 1000);
</script>
